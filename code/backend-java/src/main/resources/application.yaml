server:
  port: 8080

spring:
  application:
    name: techwatch-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5432/techwatchdb
    username: techwatch
    password: techwatchpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    techwatch.ai.orchestrator: DEBUG

app:
  name: TechWatch-AI
  version: 1.0.0
  user-agent: ${app.name}/${app.version}