services:
  # Database Service
  # Uses the official pgvector image providing PostgreSQL 16 with the 
  # vector extension pre-installed for RAG capabilities.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: techwatch-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=techwatch
      - POSTGRES_PASSWORD=techwatchpass
      - POSTGRES_DB=techwatchdb
    volumes:
      # Persistent storage configuration to maintain data across container lifecycles.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Ensures the database is fully initialized and ready to accept connections.
      test: ["CMD-SHELL", "pg_isready -U techwatch -d techwatchdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - techwatch-network

volumes:
  postgres_data:

networks:
  techwatch-network:
    driver: bridge